<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Formal Wise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one app column; a test-mode role bar on top, member screens with a bottom tab bar, planner/admin as wider single-column consoles. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#101B33; --muted:#545D72; --line:#E1E4EB; --soft:#EDF0F5;
  --hero:#101B33; --on-hero:#FFFFFF; --on-hero-muted:#C9CFDB;
  --gold:#C9963A; --gold-ink:#7E5A17; --ok:#1F5FBF; --warn:#A9520D; --warn-bg:#FCF1E4;
  --btn:#101B33; --on-btn:#FFFFFF;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1222; --surface:#141D33; --ink:#EEF1F7; --muted:#A3ACBF; --line:#26324F; --soft:#1B2642;
  --hero:#1C2949; --on-hero:#FFFFFF; --on-hero-muted:#C2CADB;
  --gold:#D9A94F; --gold-ink:#E6BD6C; --ok:#86ADF2; --warn:#F2A766; --warn-bg:#2F2213;
  --btn:#EEF1F7; --on-btn:#0B1222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1222; --surface:#141D33; --ink:#EEF1F7; --muted:#A3ACBF; --line:#26324F; --soft:#1B2642;
  --hero:#1C2949; --on-hero:#FFFFFF; --on-hero-muted:#C2CADB;
  --gold:#D9A94F; --gold-ink:#E6BD6C; --ok:#86ADF2; --warn:#F2A766; --warn-bg:#2F2213;
  --btn:#EEF1F7; --on-btn:#0B1222; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.rolebar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)))}
.rolebar-in{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tm{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:14px}
.seg button{min-height:40px;padding:0 14px;border:none;border-radius:10px;background:transparent;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.wrap{padding-block:20px 120px;padding-left:max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)))}
.col{margin:0 auto;display:flex;flex-direction:column;gap:16px}
.col.narrow{max-width:520px}.col.wide{max-width:1040px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.h1{font-family:var(--display);font-weight:500;font-size:32px;line-height:1.1}
.h1 em{font-style:italic}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.strong{border:2px solid var(--ink)}
.hero{background:var(--hero);color:var(--on-hero);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px}
.hero .eyebrow{color:var(--on-hero-muted)}
.hero .place{font-family:var(--display);font-size:34px;line-height:1.05;font-weight:500}
.hero .place em{color:var(--gold);font-style:italic}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:rgba(255,255,255,.08);border-radius:14px;padding:12px}
.tile b{display:block;font-family:var(--display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--on-hero-muted)}
.countdown{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:14px 12px 16px;display:flex;flex-direction:column;gap:10px}
.cd-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;text-align:center}
.cd-grid b{display:block;font-family:var(--display);font-size:clamp(24px,7.5vw,34px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.cd-grid span{display:block;margin-top:5px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--on-hero-muted)}
.cd-cap{text-align:center;font-size:15px;line-height:1.45;color:var(--on-hero-muted)}
.cd-ev{display:block;font-size:19px;font-weight:700;color:var(--on-hero);margin-top:2px}
.cd-when{display:block;font-size:16px;font-weight:600;color:var(--on-hero)}
.cd-none{text-align:center;font-family:var(--display);font-size:24px;padding:6px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--display);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.btn{min-height:48px;padding:0 18px;border-radius:24px;border:1px solid var(--btn);background:var(--btn);color:var(--on-btn);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#101B33}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.danger{background:var(--surface);color:var(--warn);border-color:var(--warn)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.input{min-height:48px;width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
textarea.input{min-height:90px;padding:12px 14px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pill{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:700;background:var(--soft);color:var(--ink)}
.pill.ok{color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.muted{color:var(--muted)}.small{font-size:13px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600}
.info{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.av{width:38px;height:38px;flex:none;border-radius:19px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.grow{flex:1;min-width:0}
.todo{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;background:none;border:none;border-top:1px solid var(--line);text-align:left;padding:6px 0}
.check{width:24px;height:24px;flex:none;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.check.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.group{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.group.mine{border:2px solid var(--ink)}
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:700;letter-spacing:.06em;background:var(--soft);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:44px;border:none;width:100%;text-align:left}
details.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold .chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none;margin-right:6px}
details.fold[open] .chev{transform:rotate(-135deg)}
.tablewrap{overflow-x:auto;min-width:0;max-width:100%}
table{width:100%;min-width:720px;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(8px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));padding-left:max(8px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(8px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tabs button{min-height:52px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));z-index:9;background:var(--btn);color:var(--on-btn);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;max-width:min(92vw,460px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.join{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center;gap:20px}
.big{font-family:var(--display);font-size:44px;line-height:1.05;font-weight:500}
.big em{font-style:italic;color:var(--gold-ink)}
.codein{min-height:58px;font-size:20px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.dayh{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--gold-ink);padding-top:10px}
.ev{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.ev .t{width:76px;flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.roomshow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 10px 50px;padding:12px 14px;border-radius:12px;background:var(--hero);color:var(--on-hero)}
.roomshow b{font-family:var(--display);font-size:26px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}}
.linkbtn{background:none;border:none;padding:8px 0;min-height:44px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-align:left}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
/* Phones: keep content clear of the status bar / notch. */
.rolebar{padding-top:calc(8px + var(--safe-area-inset-top,env(safe-area-inset-top,0px)))}
.wrap{padding-top:calc(20px + var(--safe-area-inset-top,env(safe-area-inset-top,0px)))}
body.has-top .wrap{padding-top:20px}
</style>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>

<body>
<div class="rolebar" id="topbar" hidden><div class="rolebar-in">
  <div style="min-width:0"><div class="tm">FORMAL WISE</div><div class="small muted" id="who" style="overflow-wrap:anywhere"></div></div>
  <div class="row"><div class="seg" role="group" aria-label="View as" id="roles"></div><button class="btn ghost sm" data-act="staffout">Sign out</button></div>
</div></div>
<div class="wrap"><div id="view" class="col narrow"><div class="loading">Loading…</div></div></div>
<nav class="tabs" id="tabs" aria-label="Member" hidden><div class="tabs-in" id="tabs-in"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
/* Data comes from Supabase. Every read and write goes through fw_* database functions,
   which check who is signed in: members sign in anonymously and claim a code; planners and admins sign in with an emailed code. */
const st={role:'guest',email:null,me:null,tab:'home',trips:{},codes:{},members:{},loaded:false,netErr:false,fatal:'',
  view:'admin',screen:'join',staff:{step:'email',email:''},
  plannerTrip:'',adminOpen:{},confirm:'',openPerson:'',q:'',detail:'',busy:'',signedOut:false};
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
st.view=ls('fw.view')==='planner'?'planner':'admin';
let sb=null,pending=false,lastSig='';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const initials=n=>(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
let toastT;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3600)}
function failMsg(e){
  if(e&&e.code==='P0001'&&e.message)return e.message;
  if(e&&e.friendly)return e.message;
  if(e&&/jwt|token|session/i.test(e.message||''))return 'Your sign-in expired. Sign in again.';
  const why=(e&&e.message)||'';
  return 'That didn’t save. Check your connection and try again.'+(why&&!/fetch|network|load failed/i.test(why)?' ('+why.slice(0,120)+')':'')}

/* ---------- server ---------- */
async function api(fn,payload){
  if(!sb)throw new Error('offline');
  const {data,error}=await sb.rpc('fw_'+fn,{p:payload||{}});
  if(error){const e=new Error(error.message||'Request failed');e.code=error.code;throw e}
  return data;
}
async function hasSession(){try{const r=await sb.auth.getSession();return !!(r&&r.data&&r.data.session)}catch(e){return false}}
function applyState(d){
  st.role=d.role||'guest';st.email=d.email||null;st.me=d.me||null;
  st.trips=d.trips||{};st.codes=d.codes||{};st.members=d.members||{};
  if(st.role==='guest'&&ls('fw.lastCode')){st.signedOut=true;lsSet('fw.lastCode',null)}
  if(st.role==='member')st.signedOut=false;
}
function applyGuest(){applyState({role:'guest'})}
/* Load everything this person is allowed to see. Re-renders only when something changed. */
async function load(force){
  let d;
  if(!(await hasSession()))d={role:'guest'};
  else d=await api('get_state',{});
  const sig=JSON.stringify(d);
  st.netErr=false;
  if(!force&&sig===lastSig&&st.loaded)return;
  lastSig=sig;applyState(d);st.loaded=true;schedule();
}
async function refresh(){try{await load(true)}catch(e){}}
async function call(fn,payload,msg){const r=await api(fn,payload);await refresh();pending=false;render();if(msg)toast(typeof msg==='function'?msg(r):msg);return r}
const upd=(tid,patch,msg)=>call('update_trip',{trip:tid,patch},msg);
/* Planner invite emails go out through the invite-planner Edge Function (it holds the Resend key, the app never does). */
async function sendInvites(tid,emails,force){
  let r;
  try{const {data,error}=await sb.functions.invoke('invite-planner',{body:{trip:tid,emails:emails||null,force:!!force}});if(error)throw error;r=data||{}}
  catch(e){r={error:true}}
  await refresh();pending=false;render();return r}
function inviteMsg(r){
  if(!r||r.error||(r.failed&&r.failed.length&&!(r.sent||[]).length))return ' The invite email didn’t send. Use Send invite on the trip to try again.';
  if((r.sent||[]).length)return ' Invite emailed to '+r.sent.join(', ')+'.';
  return ''}

/* ---------- data helpers ---------- */
const tripCodes=id=>Object.entries(st.codes).filter(([,c])=>c.tripId===id).map(([k,c])=>Object.assign({id:k},c)).sort((a,b)=>a.id.localeCompare(b.id));
const tripMembers=id=>Object.entries(st.members).filter(([,m])=>m.tripId===id).map(([k,m])=>Object.assign({id:k},m));
const youDone=m=>!!(m&&m.you&&['name','dob','phone','ecName','ecPhone'].every(k=>m.you[k]));
const dateDone=m=>!!(m&&(m.solo||(m.date&&['name','dob','phone','ecName','ecPhone'].every(k=>m.date[k]))));
const infoDone=m=>youDone(m)&&dateDone(m);
function blankMember(tripId,code,keep){return {tripId,code,you:{},date:{},solo:false,roomId:(keep&&keep.roomId)||'',hotelRoom:(keep&&keep.hotelRoom)||'',paidChapter:false,updatedAt:Date.now()}}
/* Rooms: standard = 2 members + their dates, solo = 1 member + date, penthouse = 2-4 members + dates. Each member holds 2 places: himself and his date. */
function roomsOf(t){if(t&&t.rooms&&t.rooms.length)return t.rooms;const n=(t&&t.groups)||Math.ceil(((t&&t.spots)||4)/4);return Array.from({length:n},(_,i)=>({id:'g'+(i+1),label:'Room '+(i+1),type:'standard',maxMembers:2}))}
const roomIdOf=m=>(m&&(m.roomId||(m.group?'g'+m.group:'')))||'';
const hasDate=m=>!!(m&&!m.solo&&m.date&&m.date.name);
const peopleIn=list=>list.reduce((s,m)=>s+1+(hasDate(m)?1:0),0);
function roomById(t,rid){return roomsOf(t).find(r=>r.id===rid)||null}
function roomLabel(t,rid){const r=roomById(t,rid);return r?r.label:''}
function roomRoster(tripId,rid){return tripMembers(tripId).filter(m=>roomIdOf(m)===rid)}
/* One roommate's hotel number covers the whole room: the most recently saved number in the room wins; the penthouse uses the admin's number. */
function roomNo(t,tripId,rid){if(!rid)return '';const r=roomById(t,rid);if(r&&r.type==='penthouse'&&r.number)return r.number;
  const ro=roomRoster(tripId,rid).filter(x=>x.hotelRoom).sort((a,b)=>(b.hotelAt||0)-(a.hotelAt||0));return ro.length?ro[0].hotelRoom:''}
/* What everyone else sees for a room in People: a solo room gets a plain "Room N" label so it looks like every other room. */
function publicRoomTitle(t,tripId,rid){const r=roomById(t,rid);if(!r||r.type!=='solo')return roomTitle(t,tripId,rid);
  let l=r.label||'';if(!/^Room \d+$/.test(l)){const rs=roomsOf(t),nums=rs.filter(x=>x.type!=='solo'&&x.type!=='penthouse').map(x=>+((/^Room (\d+)$/.exec(x.label||'')||[])[1]||0)),top=Math.max(rs.filter(x=>x.type!=='penthouse').length-rs.filter(x=>x.type==='solo').length,...nums,0);
    l='Room '+(top+1+rs.filter(x=>x.type==='solo').findIndex(x=>x.id===rid))}
  const n=roomNo(t,tripId,rid);return n?l+' - #'+n:l}
function hotelOf(t,m){return m?roomNo(t,m.tripId,roomIdOf(m)):''}
function roomTitle(t,tripId,rid){const l=roomLabel(t,rid);if(!l)return '';const n=roomNo(t,tripId,rid);return n?l+' - #'+n:l}
function pinnedBlock(t,big){const p=t&&t.pinned;if(!p||!p.text)return '';
  if(big)return `<div class="card" style="border:2px solid var(--gold);padding:22px;gap:14px"><div class="row" style="gap:8px;color:var(--gold-ink)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/></svg><span class="eyebrow" style="color:var(--gold-ink);font-size:13px">Pinned</span></div><div style="white-space:pre-line;font-family:var(--display);font-size:24px;line-height:1.3;font-weight:500">${esc(p.text)}</div></div>`;
  return `<div class="card" style="border:2px solid var(--gold)"><div class="row" style="gap:8px;color:var(--gold-ink)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/></svg><span class="eyebrow" style="color:var(--gold-ink)">Pinned</span></div><div style="white-space:pre-line;font-weight:600">${esc(p.text)}</div></div>`}
function pinForm(t,tripId){const ph=roomsOf(t).find(r=>r.type==='penthouse'),p=t.pinned;

const forms={
  join:f=>guard(async()=>{
    const code=String(f.get('code')||'').trim().toUpperCase().replace(/\s+/g,'');
    if(!code)return toast('Enter your access code.');
    if(!/^[A-Z0-9-]{4,24}$/.test(code))return toast('Codes use letters, numbers and a dash, like VEGA-7K2QM.');
    if(st.busy)return;st.busy='join';render();
    try{
      if(!(await hasSession())){
        const {error}=await sb.auth.signInAnonymously();
        if(error)throw friendly(/anonymous/i.test(error.message||'')?'Member sign-in isn’t turned on yet. Formal Wise needs to enable it.':'Couldn’t connect. Check your internet and try again.');
      }
      const r=await api('redeem_code',{code});
      if(!r||!r.ok)return toast((r&&r.error)||'That code didn’t work.');
      lsSet('fw.lastCode',r.code);st.signedOut=false;st.tab='home';
      await load(true);toast('You’re in. Welcome to the trip.');
    }finally{st.busy='';render()}
  }),
  staffemail:f=>guard(async()=>{const email=String(f.get('email')||'').trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return toast('Enter a valid email address.');
    if(st.busy)return;st.busy='otp';render();
    try{const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)throw friendly(error.message);
      st.staff={step:'code',email}}finally{st.busy='';render()}
    const i=$('otp');if(i)i.focus()}),
  staffcode:f=>guard(async()=>{const token=String(f.get('token')||'').replace(/\D/g,'');
    if(token.length<6)return toast('Enter the code from the email.');
    if(st.busy)return;st.busy='otp';render();
    try{const {error}=await sb.auth.verifyOtp({email:st.staff.email,token,type:'email'});
      if(error)throw friendly('That code didn’t work or expired. Check the newest email, or send a new code.');
      st.screen='join';st.staff={step:'email',email:''};await load(true)}finally{st.busy='';render()}}),
  room:f=>guard(async()=>{const s=validSession();if(!s)return;const r=String(f.get('room')||'').trim().replace(/^#/,'').slice(0,12);if(!r)return toast('Enter your hotel room number.');
    const m=st.members[s.memberId]||{};if(!roomIdOf(m))return toast('Pick a room first.');
    st.editRoom=false;await call('set_hotel_room',{room:r},'Room #'+r+' saved for your whole room.')}),
  ph:f=>guard(async()=>{const tid=String(f.get('trip')||''),t=st.trips[tid];if(!t)return;const number=String(f.get('number')||'').trim().replace(/^#/,'');
    if(!number)return toast('Enter the penthouse room number.');const max=Math.max(2,Math.min(4,parseInt(f.get('max'),10)||4));
    await call('set_penthouse',{trip:tid,resort:String(f.get('resort')||'').trim(),number,max},'Penthouse saved. Send up to '+max+' penthouse codes below.')}),
  phcode:(f,el)=>guard(async()=>{const tid=String(f.get('trip')||''),payer=String(f.get('payer')||'').trim().slice(0,80);
    if(!payer)return toast('Enter the name of the penthouse member.');if(st.busy==='code')return;
    st.busy='code';try{const r=await api('add_code',{trip:tid,payer,penthouse:true});st.lastPhCode=r.code;el.reset();await refresh();toast('Penthouse code '+r.code+' added for '+payer+'.')}
    finally{st.busy='';render()}}),
  signage:f=>guard(async()=>{const tid=String(f.get('trip')||''),a=parseInt(f.get('age'),10),t=st.trips[tid];if(!t||!(a>=16&&a<=30))return;
    const was=signAge(t);
    await upd(tid,{signerAge:a},was?(a===was?'Age unchanged.':'Signers now need to be '+a+'+. Anyone under '+a+' was taken off their room.'):'Room signers on: '+a+'+ at check-in.')}),
  addcode:(f,el)=>guard(async()=>{const tid=String(f.get('trip')||''),payer=String(f.get('payer')||'').trim().slice(0,80);
    if(!payer)return toast('Enter the name of the member who paid.');if(st.busy==='code')return;
    st.busy='code';try{const r=await api('add_code',{trip:tid,payer});st.lastCode=r.code;el.reset();await refresh();toast('Code '+r.code+' added for '+payer+'.')}
    finally{st.busy='';render()}}),
  due:f=>guard(async()=>{const tid=String(f.get('trip')||''),o=String(f.get('open')||''),c=String(f.get('close')||'');if(!st.trips[tid])return;
    if(!o||!c)return toast('Pick both the open and close days.');if(c<o)return toast('The close day has to be on or after the open day.');
    await upd(tid,{openDay:o,closeDay:c,roomsUnlock:o,infoDue:c},'Opens '+fmtDay(dayTs(o))+', closes end of '+fmtDay(dayTs(c))+'.')}),
  pin:f=>guard(async()=>{const tid=String(f.get('trip')||''),text=String(f.get('text')||'').trim();if(!st.trips[tid])return;if(!text)return toast('Write the announcement first.');
    await upd(tid,{pinned:{text:text.slice(0,400),at:Date.now()}},'Announcement pinned.')}),
  you:(f,el)=>guard(async()=>{const s=validSession();if(!s)return;if(!youOpen(st.trips[s.tripId]))return toast('Info is closed. Ask your planner.');
    if(!el.checkValidity()){el.reportValidity();return toast('Fill in every required field.')}
    const you=personFrom(f,'y_');if(you.dob==='bad')return toast('That birthday isn’t a real date. Check the month and day.');
    await call('save_you',{you});st.editYou=false;render();toast('Your info is saved.')}),
  date:(f,el)=>guard(async()=>{const s=validSession();if(!s)return;if(!dateOpen(st.trips[s.tripId]))return toast(winState(st.trips[s.tripId])==='closed'?'Date info is closed. Ask your planner.':'Date info opens with room selection.');
    const solo=!!f.get('solo');
    if(!solo&&!el.checkValidity()){el.reportValidity();return toast('Fill in every field for your date, or tap Going solo.')}
    const date=solo?{}:personFrom(f,'d_');if(!solo&&date.dob==='bad')return toast('That birthday isn’t a real date. Check the month and day.');
    await call('save_date',{date,solo});st.editDate=false;render();toast(solo?'Saved: going solo.':'Date info saved.')}),
  datedue:f=>guard(async()=>{const tid=String(f.get('trip')||''),d=String(f.get('due')||''),y=String(f.get('youdue')||''),t=st.trips[tid];if(!t)return;if(!d)return toast('Pick the date info due date.');
    const oa=winOpenAt(t),def=oa?isoDay(oa-DAY):'',patch={dateDue:d};if(y!==(t.youDue||def))patch.youDue=y;
    await upd(tid,patch,'Date info is due at the end of '+fmtDay(dayTs(d))+'.')}),
  solocode:(f,el)=>guard(async()=>{const tid=String(f.get('trip')||''),payer=String(f.get('payer')||'').trim().slice(0,80);
    if(!payer)return toast('Enter the name of the member getting the solo room.');if(st.busy==='code')return;
    st.busy='code';try{const r=await api('add_code',{trip:tid,payer,solo:true});st.lastSoloCode=r.code;el.reset();await refresh();toast('Solo room code '+r.code+' added for '+payer+'.')}
    finally{st.busy='';render()}}),
  trip:(f,el)=>guard(async()=>{
    if(!el.checkValidity()){el.reportValidity();return toast('Fill in chapter, city, resort and number of rooms.')}
    const n=Math.max(1,Math.min(200,parseInt(f.get('rooms'),10)||0));
    const planners=String(f.get('planners')||'').split(/[,;\s]+/).map(x=>x.trim().toLowerCase()).filter(x=>x.includes('@'));
    const r=await call('create_trip',{chapter:String(f.get('chapter')).trim(),school:String(f.get('school')||'').trim(),destination:String(f.get('destination')).trim(),resort:String(f.get('resort')||'').trim(),
      dates:String(f.get('dates')||'').trim(),start:String(f.get('start')||''),rooms:n,tz:String(f.get('tz')||''),planners});
    const inv=planners.length&&r&&r.trip?await sendInvites(r.trip):null;
    toast('Trip created. Up to '+(n*2)+' codes.'+(inv?inviteMsg(inv):''))}),
  planners:f=>guard(async()=>{const tid=String(f.get('trip')||'');const emails=String(f.get('emails')||'').split(/[,;\s]+/).map(x=>x.trim().toLowerCase()).filter(x=>x.includes('@'));
    await call('set_planners',{trip:tid,emails});
    if(!emails.length)return toast('Planners removed.');
    const inv=await sendInvites(tid);toast('Planners saved.'+(inv&&!inv.error&&!(inv.sent||[]).length&&!(inv.failed||[]).length?' Everyone listed already has an invite.':inviteMsg(inv)))}),
  update:(f,el)=>guard(async()=>{const text=String(f.get('text')||'').trim();if(!text)return toast('Write a message first.');const t=st.trips[st.plannerTrip];
    await upd(st.plannerTrip,{updates:[{text:text.slice(0,600),at:Date.now(),by:'Planner'}].concat(t.updates||[]).slice(0,30)},'Update posted.')}),
  itin:(f,el)=>guard(async()=>{if(!el.checkValidity()){el.reportValidity();return toast('Pick a date, a time and name the event.')}const t=st.trips[st.plannerTrip];
    const item={id:'e'+Date.now().toString(36),date:String(f.get('date')),time:String(f.get('time')),title:String(f.get('title')).trim(),place:String(f.get('place')||'').trim()};
    if(evAt(item)==null)return toast('That date or time isn’t valid.');
    await upd(st.plannerTrip,{itinerary:(t.itinerary||[]).concat([item]).slice(0,80)},'Event added.')})
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const fn=acts[b.dataset.act];if(fn){e.preventDefault();fn(b.dataset.arg)}});
document.addEventListener('submit',e=>{const el=e.target.closest('form[data-form]');if(!el)return;e.preventDefault();if(!sb)return toast('The app isn’t connected.');const fn=forms[el.dataset.form];if(fn){const a=document.activeElement;if(a&&a.blur)a.blur();fn(new FormData(el),el)}});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.col){st.col=st.col||{};st.col[d.dataset.col]=d.open}},true);
document.addEventListener('input',e=>{if(e.target.id==='pq'){st.q=e.target.value;const el=$('plist');if(el)el.innerHTML=peopleList(el.dataset.trip)}});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.room&&e.target.id.startsWith('sg-')){const tid=st.plannerTrip,t=st.trips[tid],room=e.target.dataset.room,key=e.target.value;
    const cur=currentSigners(t,tid);if(key&&Object.entries(cur).some(([r,k])=>k===key&&r!==room)){e.target.blur();render();toast('That person already signs another room. Clear them there first.');return}
    delete cur[room];if(key)cur[room]=key;e.target.blur();
    guard(()=>upd(tid,{signers:Object.entries(cur).map(([room,key])=>({room,key}))},key?'Signer updated.':'Signer removed.'));return}
  if(e.target.id==='ptrip'){st.plannerTrip=e.target.value;st.confirm='';st.detail='';e.target.blur();render()}});

/* ---------- start ---------- */
let polling=false;
async function boot(){try{await load(true)}catch(e){st.netErr=true;render()}}
async function poll(){if(polling||!sb||!st.loaded||st.role==='guest'||document.visibilityState!=='visible')return;polling=true;try{await load(false)}catch(e){}finally{polling=false}}
setInterval(poll,8000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')poll()});
(function init(){
  const cfg=window.FW_CONFIG||{};
  if(!window.supabase||!window.supabase.createClient||!cfg.supabaseUrl||!cfg.supabaseKey){st.fatal='setup';render();return}
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  render();boot();
})();
})();
</script>
</body>
</html>
